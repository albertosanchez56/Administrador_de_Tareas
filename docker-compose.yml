# Fase D: Postgres + API + Front (Nginx)
# Uso (desde la raíz del repo):
#   1. Copia .env.example → .env y revisa APP_SECURITY_JWT_SECRET
#   2. docker compose up -d --build
#   3. App: http://localhost:4200  |  API directa: http://localhost:8081
#
# El navegador llama a /api en el mismo origen (4200);
# Nginx reenvía /api al servicio "api".

services:
  db:
    image: postgres:16
    container_name: taskboard-db
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
    ports:
      - "5432:5432"
    volumes:
      - taskboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./taskboard-api
      dockerfile: Dockerfile
    container_name: taskboard-api
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/taskboard
      SPRING_DATASOURCE_USERNAME: taskboard
      SPRING_DATASOURCE_PASSWORD: taskboard
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./taskboard-web
      dockerfile: Dockerfile
    container_name: taskboard-web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  taskboard_pgdata:
