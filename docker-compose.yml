# Fase C: Postgres + API
# Uso (desde la raíz del repo):
#   1. Copia .env.example → .env y revisa APP_SECURITY_JWT_SECRET
#   2. docker compose up -d --build
#   3. API en http://localhost:8081  |  Front local: npm start (proxy a 8081)
#
# Dentro de la red Docker, la API llega a Postgres por el hostname "db"
# (nombre del servicio), no por localhost.

services:
  db:
    image: postgres:16
    container_name: taskboard-db
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
    ports:
      - "5432:5432"
    volumes:
      - taskboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./taskboard-api
      dockerfile: Dockerfile
    container_name: taskboard-api
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/taskboard
      SPRING_DATASOURCE_USERNAME: taskboard
      SPRING_DATASOURCE_PASSWORD: taskboard
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskboard_pgdata:
